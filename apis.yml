name: AirMap
description: 'AirMap was a drone airspace-management and unmanned traffic management (UTM) platform
  that provided airspace intelligence, flight planning, digital notice, and geofencing services for
  drones and their operators, exposed through a developer platform of airspace and flight APIs. It was
  surfaced as a portfolio company of bullpen-capital and added to the API Evangelist network as an
  enrichment lead. As of this enrichment pass (2026-07) the company appears defunct: airmap.com no
  longer serves a developer portal or API and now resolves to a parked Squarespace-hosted page with a
  mismatched TLS certificate, and the legacy developer.airmap.com / api.airmap.com / docs.airmap.com
  hosts no longer resolve. No live API surface remains to harvest.'
